name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs of the same workflow on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint — fast syntax / static checks, GitHub-hosted, read-only.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install PyYAML (fallback YAML validator)
        run: pip install --no-cache-dir pyyaml

      - name: Run CI lint
        run: sh .github/scripts/ci-lint.sh

      - name: Run dependency sync regression tests
        run: python3 -B RobloxLinuxDev/runtime/package/check-dependency-sync.py

  # ---------------------------------------------------------------------------
  # Full build — self-hosted CachyOS VM, gated by repository variable.
  #
  # Enable: Settings → Secrets and variables → Actions → Variables
  #         New repository variable:  ENABLE_SELF_HOSTED_BUILDS = true
  #
  # Until that variable exists and is "true", only the lint job runs.
  # The build NEVER runs on untrusted PR code.
  # ---------------------------------------------------------------------------
  build:
    name: Full build (self-hosted)
    needs: lint
    # Only on trusted pushes to main, and only when explicitly enabled.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_SELF_HOSTED_BUILDS == 'true'
    runs-on: [self-hosted, linux, x64, roblox-builder]
    # Self-hosted runners are not subject to the 6-hour hosted-job cap;
    # the first full build on the N100 can take many hours.  If it times
    # out, the next push resumes from the preserved build state.
    timeout-minutes: 720
    permissions:
      contents: read
    env:
      BUILD_JOBS: '2'
      PERSISTENT_CHECKOUT: /home/runner/r
    concurrency:
      # Shared with the build-release.yml build job: the persistent
      # /home/runner/r checkout and the builder VM must only be used by
      # one build at a time.  In-progress builds are never cancelled; a
      # queued run waits and replaces older still-pending runs only.
      group: roblox-builder-vm
      cancel-in-progress: false
    steps:
      # The build itself runs from the persistent short checkout
      # /home/runner/r, synchronized to this push's exact commit by
      # .github/scripts/sync-checkout.sh.  The runtime derives
      # Unix-domain socket paths from the data directory (sun_path limit
      # 107 bytes); the default GitHub Actions workspace
      # (/home/.../actions-runner/_work/repo/repo) is too deep.  This
      # ephemeral checkout only provides the trusted workflow scripts.
      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Read-only build job: never leave a job token in the ephemeral
          # workspace checkout on the VM.
          persist-credentials: false

      - name: Sync persistent checkout (/home/runner/r)
        run: |
          set -eu
          sh .github/scripts/sync-checkout.sh \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$PERSISTENT_CHECKOUT"

      - name: Verify Unix socket path budget
        run: |
          set -eu
          # Replicate roblox-mac's socket path calculation to fail fast if
          # the checkout path is too deep for Linux Unix-domain sockets.
          # The build data directory lives inside the persistent checkout
          # (build.sh sets ROBLOX_MAC_DATA to RobloxLinuxDev/.build/profile).
          DATA="$PERSISTENT_CHECKOUT/RobloxLinuxDev/.build/profile"
          ss_sock="$DATA/prefix/var/run/shellspawn.sock"
          ui_sock="/Volumes/SystemRoot$DATA/launch.123456/ui.sock"
          ss_len=$(LC_ALL=C printf '%s' "$ss_sock" | wc -c)
          ui_len=$(LC_ALL=C printf '%s' "$ui_sock" | wc -c)
          echo "shellspawn socket: $ss_sock ($ss_len bytes)"
          echo "UI socket:         $ui_sock ($ui_len bytes)"
          if [ "$ss_len" -gt 107 ] || [ "$ui_len" -gt 107 ]; then
            echo '::error::Checkout path too deep for Unix-domain sockets (max 107 bytes).'
            exit 1
          fi
          echo 'Socket path budget OK.'

      - name: Full build
        working-directory: /home/runner/r/RobloxLinuxDev
        run: sh build.sh

      - name: Verify AppImage exists
        working-directory: /home/runner/r/RobloxLinuxDev
        run: |
          set -eu
          test -f runtime/package/roblox-mac-x86_64.AppImage || {
            echo '::error::Build did not produce runtime/package/roblox-mac-x86_64.AppImage'
            exit 1
          }
          ls -lh runtime/package/roblox-mac-x86_64.AppImage
